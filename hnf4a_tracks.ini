# pyGenomeTracks configuration — HNF4A P1/P2 promoter coverage
# Render with 2_plot_hnf4a.sh
# IMPORTANT: set the SAME max_value on all three coverage tracks so WT/KO1/KO2
# are visually comparable. Start with 50 and adjust after the first render.

[WT]
file = per_group/WT.bpm.bw
title = WT
file_type = bigwig
color = #2171b5
height = 3
min_value = 0
max_value = 50
number_of_bins = 800
nans_to_zeros = true

[KO1]
file = per_group/KO1.bpm.bw
title = KO 1
file_type = bigwig
color = #f16913
height = 3
min_value = 0
max_value = 50
number_of_bins = 800
nans_to_zeros = true

[KO2]
file = per_group/KO2.bpm.bw
title = KO 2
file_type = bigwig
color = #f16913
height = 3
min_value = 0
max_value = 50
number_of_bins = 800
nans_to_zeros = true

[spacer]
height = 0.4

[genes]
file = hnf4a.gtf
title = HNF4A transcripts
file_type = gtf
height = 4
fontsize = 9
style = UCSC
prefered_name = transcript_name
merge_transcripts = false
labels = true

[x-axis]
where = bottom
fontsize = 9
